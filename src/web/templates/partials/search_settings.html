{% from 'partials/action_settings.html' import render_sections %}
<form class="action-settings-form" method="post" action="/actions/search-settings" hx-post="/actions/search-settings"
      hx-target="#search-dialog-content" hx-swap="innerHTML" hx-disabled-elt="find button[type='submit']" hx-disinherit="hx-disabled-elt">
  <p class="muted">Параметры загрузки страниц выдачи hh.ru.</p>
  {% if panel_resume %}<input type="hidden" name="resume_id" value="{{ panel_resume.id }}">{% endif %}
  <div class="error-box" id="search-save-error" role="alert" {{ 'hidden' if not error and not errors }}>
    {% if error %}<p>{{ error }}</p>{% endif %}
    {% for message in errors %}<p>{{ message }}</p>{% endfor %}
  </div>
  {{ render_sections(sections) }}
  <div class="dialog-actions">
    <button type="button" data-close-search>Отмена</button>
    <button type="submit" class="primary">Сохранить</button>
  </div>
</form>
